[package]
name = "omarchy-window-switcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Fast Windows-style MRU Alt-Tab switcher for Omarchy/Hyprland"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gtk4 = "0.10"
gtk4-layer-shell = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
opt-level = 3
strip = "debuginfo"
