[package]
name = "mogtab"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Visual MRU Alt-Tab switcher for Hyprland"
license = "MIT"
readme = "README.md"
repository = "https://github.com/Alman368/mogtab"
keywords = ["omarchy", "hyprland", "alt-tab", "wayland", "window-switcher"]
categories = ["command-line-utilities", "gui"]
default-run = "mogtab"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
gtk4 = "0.10"
gtk4-layer-shell = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"

[profile.release]
lto = true
opt-level = 3
strip = "debuginfo"
